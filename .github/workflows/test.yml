name: Test
on:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check dependency usage
        run: npm run lint:dependencies

      - name: Check Node.js engine versions
        run: npm run lint:engine

      - name: Check plugin file types allowed by the Claude plugin directory
        run: |
          bad=$(find plugins -type f ! -iname '*.md' ! -iname '*.txt' ! -iname '*.json' ! -iname '*.yaml' ! -iname '*.yml' ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.gif' ! -iname '*.webp' ! -iname '*.ico')
          shebang=$(find plugins -type f -exec sh -c 'head -c 2 "$1" | grep -q "^#!" && echo "$1"' _ {} \;)
          if [ -n "$bad$shebang" ]; then
            echo "Files the plugin directory refuses (allowed: Markdown, text, JSON, YAML, PNG/JPEG/GIF/WebP/ICO; no #! scripts):"
            echo "$bad"
            echo "$shebang"
            exit 1
          fi

      - name: Validate Claude Code plugin
        run: |
          npx -y @anthropic-ai/claude-code@2.1.316 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.316 plugin validate plugins/smart-diff

      # Checks the skills against the Agent Skills spec for gh skill and other agents.
      # --dry-run never creates a release; warnings (such as tag protection) don't fail it.
      - name: Validate agent skills
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check Action bundle is up to date
        run: |
          npm run build:action
          git diff --exit-code -- dist/action

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install documentation example dependencies
        run: npm ci --prefix examples/parallel-docs

      - name: Check documentation example
        run: npm test --prefix examples/parallel-docs

      - name: Test
        run: npm test

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
